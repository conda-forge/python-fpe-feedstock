{% set name = "ff3" %}
{% set version = "1.0.3" %}


package:
  name: python-fpe
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ff3-{{ version }}.tar.gz
  sha256: 88e37be28d26fa498bb9dc0f911923f0f2f26c02a1a6d1efb84ac5ebd66ae4af

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - pycryptodome
    - python >={{ python_min }}

test:
  imports:
    - ff3
  commands:
    - pip check
    - python3 -m ff3.ff3_test
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mysto/python-fpe
  summary: Format Preserving Encryption (FPE) with FF3
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bschoening
    - maresb
